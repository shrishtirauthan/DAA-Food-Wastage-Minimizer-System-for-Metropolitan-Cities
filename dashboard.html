<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
<style>
    body { font-family: Arial, sans-serif; margin:20px; }
    h2,h3 { margin-bottom:10px; }
    input,button { margin:5px 0; padding:5px; }
    .panel { border:1px solid #ccc; padding:15px; margin-bottom:20px; border-radius:8px; background:#f9f9f9; }
    #foodList li, #dashboard li { list-style:none; padding:5px; margin-bottom:5px; background:#eee; border-radius:5px; }
    #foodList button { margin-top:5px; padding:3px 8px; cursor:pointer; }
    #msg { color:green; font-weight:bold; }
</style>
</head>
<body>

<h2>Dashboard</h2>
<p id="welcome"></p>
<button onclick="logout()">Logout</button>
<hr>

<!-- Restaurant Panel -->
<div id="restaurant" class="panel" style="display:none;">
    <h3>🍴 Restaurant Panel</h3>
    <input id="food" placeholder="Food Name"><br>
    <input id="qty" placeholder="Quantity"><br>
    <input id="loc" placeholder="Restaurant Location"><br>
    <input id="fresh" placeholder="Freshness (days)"><br>
    <button onclick="addFood()">Submit Food</button>
</div>

<!-- NGO Panel -->
<div id="ngo" class="panel" style="display:none;">
    <h3>🏢 NGO Panel</h3>
    <input id="people" placeholder="No. of People"><br>
    <input id="need" placeholder="Food Needed"><br>
    <input id="ngoLoc" placeholder="NGO Location"><br>
    <button onclick="addReq()">Generate Request</button>

    <h3>🍱 Available Food</h3>
    <ul id="foodList"></ul>
</div>

<!-- Dashboard -->
<div class="panel">
    <h3>📊 Dashboard Data</h3>
    <ul id="dashboard"></ul>
    <p id="msg"></p>
</div>

<script>
// ================= GET CURRENT USER =================
let user = JSON.parse(localStorage.getItem("currentUser"));
if(!user) location="login.html";

welcome.innerHTML = `👋 ${user.username} (${user.role})`;

// ================= SHOW ROLE PANEL =================
if(user.role === "restaurant"){
    restaurant.style.display = "block";
} else {
    ngo.style.display = "block";
    loadFood();
}

// ================= ADD FOOD =================
function addFood(){
    if(!food.value || !qty.value || !loc.value || !fresh.value){
        alert("Please fill all fields!");
        return;
    }

    let data = JSON.parse(localStorage.getItem("donations")) || [];

    // Prevent duplicates
    let exists = data.some(d =>
        d.rname === user.username &&
        d.food.trim().toLowerCase() === food.value.trim().toLowerCase() &&
        d.loc.trim().toLowerCase() === loc.value.trim().toLowerCase()
    );

    if(exists){
        alert("Food already submitted!");
        return;
    }

    data.push({
        rname: user.username,
        food: food.value.trim(),
        qty: qty.value.trim(),
        loc: loc.value.trim(),
        fresh: parseInt(fresh.value)
    });

    localStorage.setItem("donations", JSON.stringify(data));

    msg.innerHTML = "✅ Food Submitted Successfully";
    food.value = qty.value = loc.value = fresh.value = "";
    showDashboard();
}

// ================= NGO REQUEST =================
function addReq(){
    if(!people.value || !need.value || !ngoLoc.value){
        alert("Please fill all fields!");
        return;
    }

    let req = JSON.parse(localStorage.getItem("requests")) || [];

    // Prevent duplicates
    let exists = req.some(r =>
        r.ngo === user.username &&
        r.loc.trim().toLowerCase() === ngoLoc.value.trim().toLowerCase() &&
        r.people === people.value
    );

    if(exists){
        alert("Request already exists!");
        return;
    }

    req.push({
        ngo: user.username,
        people: people.value.trim(),
        need: need.value.trim(),
        loc: ngoLoc.value.trim()
    });

    localStorage.setItem("requests", JSON.stringify(req));

    msg.innerHTML = "✅ Request Generated";
    people.value = need.value = ngoLoc.value = "";
    loadFood();
    showDashboard();
}

// ================= LOAD FOOD =================
function loadFood(){
    let data = JSON.parse(localStorage.getItem("donations")) || [];
    let req = JSON.parse(localStorage.getItem("requests")) || [];
    foodList.innerHTML = "";

    if(req.length === 0) return;

    let ngoLocation = req[req.length-1].loc.trim().toLowerCase();

    data.forEach((d,i)=>{
        let foodLoc = d.loc.trim().toLowerCase();
        let status="", route="";

        if(d.fresh <= 0){
            status = "❌ Expired";
            route = "Not Deliverable";
        }
        else if(foodLoc === ngoLocation){
            status = "✅ Nearby";
            route = "Shortest Path 🚚";
        }
        else{
            status = "⚠️ Far";
            route = "Long Route 🚚";
        }

        let li = document.createElement("li");
        li.innerHTML = `
            <strong>🍱 ${d.food} (${d.qty})</strong><br>
            🏪 Restaurant: ${d.rname}<br>
            📍 Location: ${d.loc}<br>
            🕒 Fresh: ${d.fresh} days<br>
            Status: ${status}<br>
            Route: ${route}<br>
        `;

        if(d.fresh > 0){
            let btn = document.createElement("button");
            btn.textContent = "Collect";
            btn.addEventListener("click", () => collect(i));
            li.appendChild(btn);
        }

        foodList.appendChild(li);
    });
}

// ================= COLLECT FOOD =================
function collect(i){
    let data = JSON.parse(localStorage.getItem("donations")) || [];
    let req = JSON.parse(localStorage.getItem("requests")) || [];
    if(i<0 || i>=data.length || req.length===0){
        alert("Invalid operation!");
        return;
    }

    let foodItem = data[i];
    let ngo = req[req.length-1];

    if(foodItem.fresh <= 0){
        alert("❌ Food expired. Cannot collect.");
        return;
    }

    let route = (foodItem.loc.trim().toLowerCase() === ngo.loc.trim().toLowerCase()) ?
        "Shortest Path Delivery 🚚" :
        "Long Distance Delivery 🚚";

    alert("🎉 Food Collected!\n" + route);

    data.splice(i,1);
    localStorage.setItem("donations", JSON.stringify(data));
    loadFood();
    showDashboard();
}

// ================= DASHBOARD =================
function showDashboard(){
    let d = JSON.parse(localStorage.getItem("donations")) || [];
    let r = JSON.parse(localStorage.getItem("requests")) || [];
    dashboard.innerHTML="";

    if(d.length){
        dashboard.innerHTML += "<strong>Available Donations:</strong><br>";
        d.forEach(x=>{
            dashboard.innerHTML += `<li>🍱 ${x.food} from ${x.rname} (${x.loc}) - Fresh: ${x.fresh} days</li>`;
        });
    }

    if(r.length){
        dashboard.innerHTML += "<br><strong>NGO Requests:</strong><br>";
        r.forEach(x=>{
            dashboard.innerHTML += `<li>🏢 ${x.ngo} needs ${x.need} for ${x.people} people (${x.loc})</li>`;
        });
    }
}

// ================= LOGOUT =================
function logout(){
    localStorage.removeItem("currentUser");
    location="index.html";
}

showDashboard();
if(user.role!=="restaurant") loadFood();

</script>
</body>
</html>
